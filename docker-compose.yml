services:
  db:
    image: postgres:16-alpine
    container_name: sentiment_db
    environment:
      POSTGRES_DB: sentiment_db
      POSTGRES_USER: sentiment_user
      POSTGRES_PASSWORD: sentiment_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiment_backend
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-secure-docker-secret-key-replace-in-env"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DATABASE_URL: "postgresql://sentiment_user:sentiment_secure_password@db:5432/sentiment_db"
      CORS_ALLOW_ALL: "True"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/ml_models:/app/ml_models
    restart: unless-stopped

volumes:
  postgres_data:
